# 开发模式配置
# 使用方法: docker compose -f docker-compose.yml -f compose.dev.yml up

services:
  # 开发环境：独立的 MongoDB 实例，暴露端口方便调试
  mongodb:
    ports:
      - "27017:27017"

  # 开发环境的后端服务 - 覆盖模式，使用 Granian 热重载
  backend:
    command: granian api.app:app --interface asgi --host 0.0.0.0 --port 8000 --reload --loop uvloop
    environment:
      # 开发环境：启用调度器和 worker（基于 Leader Election）
      # 多个开发实例会自动选举 Leader，避免重复调度
      ENABLE_SCHEDULER: "true"   # 启用调度器（Leader Election）
      ENABLE_WORKER: "true"      # 启用 worker 消费任务
      WORKER_CONCURRENCY: "5"    # 开发环境降低并发数
    volumes:
      # 挂载代码目录实现热重载
      - ../backend/api:/app/api:ro
      - ../backend/utils:/app/utils:ro
      - ../backend/baseline:/app/baseline:ro
      - ../backend/rules:/app/rules:ro
      - ../backend/config.py:/app/config.py:ro
      # 挂载模型文件目录
      - ../backend/output/models:/app/models:ro
    labels:
      # 开发模式：添加直连后端路由（不经过认证中间件）
      - traefik.enable=true
      - traefik.http.routers.fb-backend-dev.rule=Host(`fb-dev.${DOMAIN}`)
      - traefik.http.routers.fb-backend-dev.entrypoints=websecure
      - traefik.http.routers.fb-backend-dev.tls=true
      - traefik.http.routers.fb-backend-dev.middlewares=strip-user-headers@file
      - traefik.http.routers.fb-backend-dev.service=fb-backend-dev-svc
      - traefik.http.services.fb-backend-dev-svc.loadbalancer.server.port=8000
    networks:
      default:
      gateway-https:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-backend-dev

  # 开发环境的前端服务 - 覆盖模式
  frontend:
    volumes:
      # 挂载本地构建的 dist 目录和开发配置
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../frontend/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
