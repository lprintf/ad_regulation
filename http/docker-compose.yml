services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data-http:/data/db
    networks:
      - default  # 内部网络
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-http:/data
    networks:
      - default  # 内部网络
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # HTTP_PROXY: ${HTTP_PROXY:-}
        # HTTPS_PROXY: ${HTTPS_PROXY:-}
        # NO_PROXY: ${NO_PROXY:-}
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      MONGODB_HOST: mongodb
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # 分布式任务队列配置（基于 Redis Leader Election）
      ENABLE_SCHEDULER: "true"   # 所有实例启用调度器，自动选举 Leader
      ENABLE_WORKER: "true"       # 所有实例启用 worker（消费任务）
      WORKER_CONCURRENCY: "10"    # Worker 并发数
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
    volumes:
      # 挂载模型文件目录（生产环境也需要）
      - ../backend/output/models:/app/models:ro
    networks:
      - default  # 内部网络
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      BACKEND_HOST: backend
    volumes:
      # nginx 配置挂载到 default.conf.template（覆盖 nginx 默认配置）
      - ../frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      default:
        # 内部网络使用简单服务名
      gateway-http:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-frontend  # 外部网络使用唯一别名
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=strip-user-headers@file,oidc-auth@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
      # 使用优化的 HTTP/1.1 连接池 transport（高并发场景）
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.serverstransport=http1-pool@file
    restart: unless-stopped

volumes:
  mongo-data-http:
  redis-data-http:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-ad-regulation-http}_internal
  gateway-http:
    external: true
