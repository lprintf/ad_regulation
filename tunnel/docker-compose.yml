services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo:/data/db
    networks:
      - default  # 内部网络
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis:/data
    networks:
      - default  # 内部网络
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # HTTP_PROXY: ${HTTP_PROXY:-}
        # HTTPS_PROXY: ${HTTPS_PROXY:-}
        # NO_PROXY: ${NO_PROXY:-}
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      MONGODB_HOST: mongodb
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-fb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # 分布式任务队列配置（基于 Redis Leader Election）
      ENABLE_SCHEDULER: "true"   # 所有实例启用调度器，自动选举 Leader
      ENABLE_WORKER: "true"       # 所有实例启用 worker（消费任务）
      WORKER_CONCURRENCY: "10"    # Worker 并发数
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
    volumes:
      # 挂载模型文件目录（生产环境也需要）
      - ../backend/output/models:/app/models:ro
    networks:
      - default  # 内部网络
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      BACKEND_HOST: backend
    volumes:
      # nginx 配置挂载到 default.conf.template（覆盖 nginx 默认配置）
      - ../frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      default:
        # 内部网络使用简单服务名
      gateway-http:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-frontend  # 外部网络使用唯一别名
    labels:
      - traefik.enable=true
      
      # 域名1 路由
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain1.rule=Host(`${COMPOSE_PROJECT_NAME}.${DOMAIN}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain1.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain1.middlewares=strip-user-headers@file,oidc-auth@file
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain1.service=${COMPOSE_PROJECT_NAME}
      
      # 域名2 路由
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain2.rule=Host(`${COMPOSE_PROJECT_NAME}.${DOMAIN2}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain2.entrypoints=web
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain2.middlewares=strip-user-headers@file,oidc-auth2@file
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-domain2.service=${COMPOSE_PROJECT_NAME}
      
      # 服务定义（两个路由共享）
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.serverstransport=http1-pool@file
    restart: unless-stopped

volumes:
  mongo:
  redis:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_internal
  gateway-http:
    external: true
