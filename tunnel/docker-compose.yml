services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo:/data/db
    networks:
      - default  # 内部网络
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis:/data
    networks:
      - default  # 内部网络
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # HTTP_PROXY: ${HTTP_PROXY:-}
        # HTTPS_PROXY: ${HTTPS_PROXY:-}
        # NO_PROXY: ${NO_PROXY:-}
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      MONGODB_HOST: mongodb
      MONGODB_DB_NAME: ${COMPOSE_PROJECT_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # 分布式任务队列配置（基于 Redis Leader Election）
      ENABLE_SCHEDULER: "true"   # 所有实例启用调度器，自动选举 Leader
      ENABLE_WORKER: "true"       # 所有实例启用 worker（消费任务）
      WORKER_CONCURRENCY: "10"    # Worker 并发数
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
    volumes:
      # 挂载模型文件目录（生产环境也需要）
      - ../backend/output/models:/app/models:ro
    networks:
      - default  # 内部网络
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        NO_PROXY: "*"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      BACKEND_HOST: backend
    volumes:
      # nginx 配置挂载到 default.conf.template（覆盖 nginx 默认配置）
      - ../frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      default:
        # 内部网络使用简单服务名
      gateway:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-frontend  # 外部网络使用唯一别名
    restart: unless-stopped
    # Traefik labels 通过 compose.single-domain.yml 或 compose.dual-domain.yml 添加

volumes:
  mongo:
  redis:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_internal
  gateway:
    external: true
