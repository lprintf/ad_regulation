# 开发模式配置
# 使用方法: docker compose -f compose.yml -f compose.dev.yml up

services:
  fb-mongodb:
    ports:
      - "27017:27017"

  fb-backend:
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload --loop uvloop
    volumes:
      # 挂载代码目录实现热重载
      - ./backend/api:/app/api:ro
      - ./backend/utils:/app/utils:ro
      - ./backend/baseline:/app/baseline:ro
      - ./backend/config.py:/app/config.py:ro
    labels:
      # 开发模式：添加直连后端路由（不经过认证中间件）
      - "traefik.enable=true"
      - "traefik.http.routers.fb-dev.rule=Host(`fb-dev.${DOMAIN:-127.0.0.1.sslip.io}`)"
      - "traefik.http.routers.fb-dev.entrypoints=websecure"
      - "traefik.http.routers.fb-dev.tls=true"
      - "traefik.http.routers.fb-dev.service=fb-backend-dev-svc"
      - "traefik.http.services.fb-backend-dev-svc.loadbalancer.server.port=8000"

  frontend:
    volumes:
      # 挂载本地构建的 dist 目录和开发配置
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
